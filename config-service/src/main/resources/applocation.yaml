spring:
  application:
    name: config-server

  profiles:
    active: git,vault

  cloud:
    config:
      server:
        git:
          uri:
        vault:
          host: localhost
          token: VaultToken
          backend: secret
          kv-version: 2
          authentication: TOKEN
          scheme: http
          port: 8200

server:
  port: 8071

management:
  endpoints:
    web.exposure.include: health,info
  health.probes.enabled: true
